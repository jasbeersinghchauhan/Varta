<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />

  <title>Varta</title>

  <meta name="description" content="Varta is a secure real-time messaging and video calling platform." />

  <link rel="icon" type="image/svg+xml" href="/public/varta-logo.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="preload" href="/src/homepage.css" as="style" />
  <link rel="stylesheet" href="/src/homepage.css" />

  <meta property="og:title" content="Varta Messaging" />
  <meta property="og:description" content="Secure real-time chat and video calling platform." />
  <meta property="og:type" content="website" />

  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
</head>

<body>
  <div class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button id="mainMenuBtn" class="icon-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="logo">Varta</div>
        <button id="addContactBtn" class="icon-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>

        <button id="callHistoryBtn" class="icon-btn" title="Call Logs" style="color: var(--primary-blue);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
            </path>
          </svg>
        </button>
      </div>

      <div id="conversationList" class="conversation-list"></div>
    </aside>

    <!-- CHAT -->
    <main class="chat">
      <header class="chat-header">
        <button id="backBtn" class="icon-btn mobile-only">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7" />
          </svg>
        </button>

        <div class="chat-user" id="headerProfileBtn">
          <div class="avatar-container">
            <img id="chatAvatar" alt="avatar" />
            <span id="chatHeaderStatusDot" class="status-dot"></span>
          </div>

          <div class="chat-user-info">
            <span id="chatUsername">User Name</span>
            <span id="chatUserEmail">User Email</span>
          </div>
        </div>

        <div class="chat-actions">
          <button id="audioCall" class="icon-btn">
            <img src="/public/phone.svg" alt="Phone" />
          </button>

          <button id="videoCall" class="icon-btn">
            <img src="/public/video-camera.svg" alt="Video" />
          </button>

          <button id="profileBtn" class="icon-btn">⋮</button>
        </div>
      </header>

      <div id="messages" class="messages">
      </div>

      <footer class="message-input">
        <label class="file-upload">
          <input type="file" id="fileInput" />
          +
        </label>

        <input id="messageInput" placeholder="Type a message..." autocomplete="off" />

        <button id="sendBtn">Send</button>
      </footer>
    </main>
  </div>

  <!-- CONTACT MENU -->
  <div id="contactMenu" class="contact-menu hidden">
    <button id="viewContactProfileBtn">View Profile</button>
    <button id="viewMediaBtn">View Media</button>
    <button id="clearChatBtn" class="danger">Clear Chat</button>
    <button id="deleteContactBtn" class="danger">Delete Contact</button>
  </div>

  <div id="contactProfileModal" class="modal hidden">
    <div class="modal-content profile">
      <img id="contactProfileAvatar" />

      <h3 id="contactProfileName"></h3>

      <p id="contactProfileEmail"></p>

      <div class="modal-actions profile-actions">
        <button id="closeContactProfile" style="width: 100%;">Close</button>
      </div>
    </div>
  </div>

  <!-- ADD CONTACT MODAL -->
  <div id="addContactModal" class="modal hidden">
    <div class="modal-content">
      <h3>Add Contact</h3>

      <input id="contactEmail" placeholder="Enter email" />

      <div class="modal-actions">
        <button id="cancelAddContact">Cancel</button>

        <button id="confirmAddContact">Add</button>
      </div>
    </div>
  </div>

  <!-- PROFILE MODAL -->
  <div id="profileModal" class="modal hidden">
    <div class="modal-content profile">
      <img id="profileAvatar" />

      <h3 id="profileName"></h3>

      <p id="profileEmail"></p>

      <div class="modal-actions profile-actions">
        <button id="closeProfile">Close</button>
        <button id="logoutBtn">Logout</button>
      </div>
    </div>
  </div>

  <!-- INCOMING CALL MODAL -->
  <div id="incomingCallModal" class="modal hidden">
    <div class="modal-content profile">
      <h3 style="margin-bottom: 10px;">Incoming Video Call</h3>
      <p id="incomingCallName" style="margin-bottom: 20px;">Someone is calling...</p>

      <div class="modal-actions profile-actions" style="display: flex; gap: 10px;">
        <button id="rejectCallBtn" class="danger" style="flex: 1;">Decline</button>
        <button id="acceptCallBtn"
          style="flex: 1; background: var(--secondary-green); color: white; border: none; border-radius: 8px; cursor: pointer;">Accept</button>
      </div>
    </div>
  </div>

  <!-- VIDEO CALL -->
  <div id="videoModal" class="video-modal hidden">
    <div class="video-wrapper">

      <video id="remoteVideo" autoplay playsinline></video>

      <div class="top-bar">
        <div class="user-info">
          <div class="name" id="userName"></div>
          <div class="status" id="callStatus"></div>
        </div>
      </div>

      <video id="localVideo" autoplay muted playsinline></video>

      <div class="call-controls">
        <button id="muteBtn">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 14a3 3 0 003-3V5a3 3 0 10-6 0v6a3 3 0 003 3z" />
            <path d="M19 11a7 7 0 01-14 0H3a9 9 0 0018 0h-2z" />
          </svg>
        </button>

        <button id="cameraBtn">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M17 10.5V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-3.5l4 4v-11l-4 4z" />
          </svg>
        </button>

        <button id="endCallBtn" class="btn end">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M21 15.5l-5-2.5a1 1 0 00-1 .1l-2 1.5a11 11 0 01-5-5l1.5-2a1 1 0 00.1-1L8.5 3H3v5.5a16 16 0 0016 16H21v-9z" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div id="globalLoader" class="loader hidden">
    <div class="loader-spinner"></div>
  </div>

  <!-- MESSAGE CONTEXT MENU -->
  <div id="messageMenu" class="hidden">
    <button id="editMsgBtn">Edit Message</button>
    <button id="deleteMsgBtn" class="danger">Delete Message</button>
  </div>

  <!-- EDIT MESSAGE -->
  <div id="editMessageModal" class="modal hidden">
    <div class="modal-content">
      <h3>Edit Message</h3>
      <input id="editMessageInput" placeholder="New message..." />
      <div class="modal-actions">
        <button id="cancelEditMsg" style="background: var(--input-bg); color: var(--text-main);">Cancel</button>
        <button id="confirmEditMsg" style="background: var(--primary-blue); color: #fff;">Save</button>
      </div>
    </div>
  </div>

  <!-- CALL LOGS -->
  <div id="callLogsModal" class="modal hidden">
    <div class="modal-content profile" style="max-height: 80vh; overflow-y: auto;">
      <h3>Call History</h3>
      <div id="callLogsList" style="width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
      </div>
      <div class="modal-actions profile-actions">
        <button id="closeCallLogs" style="width: 100%;">Close</button>
      </div>
    </div>
  </div>
  <script src="/src/homepage.js"></script>
</body>

</html>
