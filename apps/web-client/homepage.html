<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />

  <title>Varta</title>

  <meta name="description" content="Varta is a secure real-time messaging and video calling platform." />

  <link rel="icon" type="image/svg+xml" href="/public/varta-logo.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="preload" href="/src/homepage.css" as="style" />
  <link rel="stylesheet" href="/src/homepage.css" />

  <meta property="og:title" content="Varta Messaging" />
  <meta property="og:description" content="Secure real-time chat and video calling platform." />
  <meta property="og:type" content="website" />

  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
</head>

<body>
  <div class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button id="mainMenuBtn" class="icon-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="logo">Varta</div>
        <button id="addContactBtn" class="icon-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
      </div>

      <div id="conversationList" class="conversation-list"></div>
    </aside>

    <!-- CHAT -->
    <main class="chat">
      <header class="chat-header">
        <button id="backBtn" class="icon-btn mobile-only">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7" />
          </svg>
        </button>

        <div class="chat-user" id="headerProfileBtn">
          <div class="avatar-container">
            <img id="chatAvatar" alt="avatar" />
            <span id="chatHeaderStatusDot" class="status-dot"></span>
          </div>

          <div class="chat-user-info">
            <span id="chatUsername">User Name</span>
            <span id="chatUserEmail">User Email</span>
          </div>
        </div>

        <div class="chat-actions">
          <button id="audioCall" class="icon-btn">
            <img src="/public/phone.svg" alt="Phone" />
          </button>

          <button id="videoCall" class="icon-btn">
            <img src="/public/video-camera.svg" alt="Video" />
          </button>

          <button id="profileBtn" class="icon-btn">⋮</button>
        </div>
      </header>

      <div id="messages" class="messages">
      </div>

      <footer class="message-input">
        <label class="file-upload">
          <input type="file" id="fileInput" />
          +
        </label>

        <input id="messageInput" placeholder="Type a message..." autocomplete="off" />

        <button id="sendBtn">Send</button>
      </footer>
    </main>
  </div>

  <!-- CONTACT MENU -->
  <div id="contactMenu" class="contact-menu hidden">
    <button id="viewContactProfileBtn">View Profile</button>
    <button id="viewMediaBtn">View Media</button>
    <button id="clearChatBtn" class="danger">Clear Chat</button>
    <button id="deleteContactBtn" class="danger">Delete Contact</button>
  </div>

  <div id="contactProfileModal" class="modal hidden">
    <div class="modal-content profile">
      <img id="contactProfileAvatar" />

      <h3 id="contactProfileName"></h3>

      <p id="contactProfileEmail"></p>

      <div class="modal-actions profile-actions">
        <button id="closeContactProfile" style="width: 100%;">Close</button>
      </div>
    </div>
  </div>

  <!-- ADD CONTACT MODAL -->
  <div id="addContactModal" class="modal hidden">
    <div class="modal-content">
      <h3>Add Contact</h3>

      <input id="contactEmail" placeholder="Enter email" />

      <div class="modal-actions">
        <button id="cancelAddContact">Cancel</button>

        <button id="confirmAddContact">Add</button>
      </div>
    </div>
  </div>

  <!-- PROFILE MODAL -->
  <div id="profileModal" class="modal hidden">
    <div class="modal-content profile">
      <img id="profileAvatar" />

      <h3 id="profileName"></h3>

      <p id="profileEmail"></p>

      <div class="modal-actions profile-actions">
        <button id="closeProfile">Close</button>
        <button id="logoutBtn">Logout</button>
      </div>
    </div>
  </div>

  <!-- VIDEO CALL -->
  <div id="videoModal" class="video-modal hidden">
    <div class="video-wrapper">
      <video id="remoteVideo" autoplay></video>

      <video id="localVideo" autoplay muted></video>

      <div class="call-controls">
        <button id="muteBtn">Mute</button>

        <button id="cameraBtn">Camera</button>

        <button id="endCallBtn" class="end">End</button>
      </div>
    </div>
  </div>

  <div id="globalLoader" class="loader hidden">
    <div class="loader-spinner"></div>
  </div>
  <script src="/src/homepage.js"></script>
</body>

</html>
